---
- name: Start domains in declared order
  ansible.builtin.command:
    argv: ["{{ virsh_binary }}", "-c", "{{ libvirt_uri }}", "start", "{{ item.name }}"]
  loop: "{{ (project.virtual_machines | default([])) | sort(attribute='start_order') }}"
  register: domain_start
  changed_when: domain_start.rc == 0
  failed_when: domain_start.rc != 0 and 'already active' not in domain_start.stderr
- name: Mark run active
  ansible.builtin.copy:
    content: "{{ {'project_id': project_id, 'run_id': run_id, 'state': 'active'} | to_nice_json(indent=2, sort_keys=true) }}\n"
    dest: "{{ kvm_lab_storage_root }}/projects/{{ project_id }}/runs/{{ run_id }}/runtime/state.json"
    mode: "0640"
