name: validate
on:
  pull_request:
  push:
    branches: ["**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check ansible-lint yamllint jsonschema
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
      - run: ansible-lint ansible/playbooks ansible/roles
      - run: yamllint -s .
      - run: shellcheck scripts/kvm-lab-manager
      - run: python -m unittest discover -s tests -p 'test_*.py'
